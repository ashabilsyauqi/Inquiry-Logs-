services:
  crm-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: crm-app
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8080}:80"
    environment:
      APP_NAME: "${APP_NAME:-Difitech CRM}"
      APP_ENV: "${APP_ENV:-production}"
      APP_DEBUG: "${APP_DEBUG:-false}"
      APP_URL: "${APP_URL:-http://localhost:8080}"
      LOG_CHANNEL: stack
      LOG_LEVEL: info
      DB_CONNECTION: mysql
      DB_HOST: crm-db
      DB_PORT: 3306
      DB_DATABASE: "${DB_DATABASE:-crm_difitech}"
      DB_USERNAME: "${DB_USERNAME:-crm_user}"
      DB_PASSWORD: "${DB_PASSWORD:-DifitechCrm2026!}"
      SESSION_DRIVER: "${SESSION_DRIVER:-file}"
      SESSION_LIFETIME: 120
      CACHE_STORE: "${CACHE_STORE:-file}"
      QUEUE_CONNECTION: sync
      WA_BRIDGE_URL: "http://crm-wa-bridge:3001"
      RUN_SEEDER: "${RUN_SEEDER:-true}"
    volumes:
      - crm_storage:/var/www/html/storage
      - crm_bootstrap:/var/www/html/bootstrap/cache
    depends_on:
      crm-db:
        condition: service_healthy
      crm-wa-bridge:
        condition: service_started
    networks:
      - crm_network

  crm-wa-bridge:
    build:
      context: ./wa-bridge
      dockerfile: Dockerfile
    container_name: crm-wa-bridge
    restart: unless-stopped
    environment:
      PORT: 3001
      BRIDGE_PORT: 3001
      APP_URL: "http://crm-app:80"
      WEBHOOK_BASE_URL: "http://crm-app:80"
      WEBHOOK_URL: "http://crm-app:80/api/wa-webhook"
      DISCONNECT_ALERT_URL: "http://crm-app:80/api/wa-disconnect-alert"
      STATUS_UPDATE_URL: "http://crm-app:80/api/wa-status-update"
    volumes:
      - wa_sessions:/app
    networks:
      - crm_network

  crm-db:
    image: mysql:8.0
    container_name: crm-db
    restart: unless-stopped
    command: --default-authentication-plugin=mysql_native_password --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_DATABASE: "${DB_DATABASE:-crm_difitech}"
      MYSQL_USER: "${DB_USERNAME:-crm_user}"
      MYSQL_PASSWORD: "${DB_PASSWORD:-DifitechCrm2026!}"
      MYSQL_ROOT_PASSWORD: "${DB_ROOT_PASSWORD:-DifitechRoot2026!}"
    volumes:
      - crm_db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$$MYSQL_ROOT_PASSWORD || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - crm_network

volumes:
  crm_db_data:
    driver: local
  crm_storage:
    driver: local
  crm_bootstrap:
    driver: local
  wa_sessions:
    driver: local

networks:
  crm_network:
    driver: bridge
